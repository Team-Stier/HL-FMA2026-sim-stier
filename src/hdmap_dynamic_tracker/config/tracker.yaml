hdmap_dynamic_tracker:
  ros__parameters:
    frame_id: map
    target_rate_hz: 20.0
    occupancy:
      known_free_radius_m: 80.0
      unknown_probability: -1.0
      # Safety envelope: apply the full configured sigma range. Do not hard-cap
      # it here; doing so can turn likely occupied future cells into unknown.
      uncertainty_sigma_multiplier: 2.0
    prediction:
      process_acceleration_sigma_mps2: 2.0
      position_measurement_sigma_m: 0.5
      initial_velocity_sigma_mps: 5.0
      minimum_frame_dt_s: 0.0001
    signals:
      # IONIQ 6 shortest measured 100-0 km/h stop: 35.1 m (~11.0 m/s^2).
      design_deceleration_mps2: 11.0
      # Yellow-light stop/go decision. This matches the current Control package's
      # maximum commanded deceleration; replace with VTD IONIQ 6 measurements.
      yellow_decision_deceleration_mps2: 3.0
      braking_distance_factor: 1.0
      latency_budget_s: 0.0
      # Cells covering this distance before the stop line receive a 0 m/s cap.
      stop_margin_m: 7.0
      hold_speed_mps: 0.2
      hold_distance_m: 1.0
      # After VTD calibration, add paired arrays as shown below. Omit them while
      # empty because ROS parameter YAML cannot portably infer an empty array type.
      # braking_calibration:
      #   speed_mps: [2.0, 4.0, 6.0, 8.0, 30.0]
      #   distance_m: [MEASURED_VALUES_IN_METRES]
      # Speeds must strictly increase and worst-case distances must be positive
      # and nondecreasing. Distance is measured from actual deceleration onset
      # to full stop; command latency belongs in latency_budget_s. Values between
      # bins use the next higher bin, and values above the table never extrapolate.
    vehicle:
      rear_axle_to_front_m: 3.808
      wheelbase_m: 2.944
